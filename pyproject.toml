[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awesome-statement-parser"
version = "0.1.0"
description = "Universal, fully local bank and credit card statement parser — LiteParse + a local LLM (Gemma 4) + a strict reconciliation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "liteparse>=2.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "msoffcrypto-tool>=5.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
synth = ["reportlab>=4.0"]
dev = ["reportlab>=4.0", "pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
asp = "awesome_statement_parser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_statement_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live_llm: needs a running LM Studio server (skipped otherwise)"]
